# Leaflet requests tiles as plain <img> GETs, which cannot carry an
# Authorization header. Both tile endpoints therefore opt out of the platform's
# JWT gate and verify the session token themselves (header OR ?token=), plus an
# ownership check against odm_tasks. See supabase/functions/_shared/tileAuth.ts.
[functions.ndvi-tile]
verify_jwt = false

[functions.tile]
verify_jwt = false

# Pilot applicants are not signed in - that is the whole point of the form. The
# platform gate is therefore off; the RLS insert policy on pilot_applications
# and the shared validator are what constrain what can be submitted. The
# matching read endpoint, pilot-applications, keeps the gate on.
[functions.pilot-apply]
verify_jwt = false
