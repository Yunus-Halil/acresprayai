[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offrow"
version = "0.1.0"
description = "Off-row vegetation detection in early-season corn from RGB drone imagery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# The geometric core has no ML dependency. Learning lives behind the "learn"
# extra below and in the offrow.learn package only.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "typer>=0.12",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# The learning track (offrow.learn). Torch trains, onnxruntime checks the export,
# the browser runs the result. Nothing in the geometric core imports these.
learn = [
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.15",
    "onnxscript>=0.2",
    "onnxruntime>=1.17",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
offrow = "offrow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/offrow"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: renders synthetic scenes; excluded by default, run with -m slow",
    "dataset: needs a public dataset present under data/",
]
filterwarnings = ["error::DeprecationWarning:offrow.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Stubs raise NotImplementedError and legitimately do not use their arguments.
"src/offrow/*.py" = ["ARG001"]
# typer declares options as call-valued defaults. That is the framework, not a bug.
"src/offrow/cli.py" = ["B008"]
"src/offrow/learn/cli.py" = ["B008"]
