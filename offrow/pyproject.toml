[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offrow"
version = "0.1.0"
description = "Off-row vegetation detection in early-season corn from RGB drone imagery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# No torch, no tensorflow, no pretrained models. scikit-learn is permitted only
# for the one-class anomaly step, which is not built yet, so it is not a
# dependency yet either.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "typer>=0.12",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
offrow = "offrow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/offrow"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "dataset: needs a public dataset present under data/",
]
filterwarnings = ["error::DeprecationWarning:offrow.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Stubs raise NotImplementedError and legitimately do not use their arguments.
"src/offrow/*.py" = ["ARG001"]
# typer declares options as call-valued defaults. That is the framework, not a bug.
"src/offrow/cli.py" = ["B008"]
