<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label a region</title>
<style>
  :root { color-scheme: dark; --bg: #121212; --fg: #f0f0f0; --muted: #9e9e9e; --line: #333; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header label { display: inline-flex; gap: 6px; align-items: center; }
  input, select, button { font: inherit; background: #0f0f0f; color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; }
  button.on { border-color: #4CAF50; color: #4CAF50; }
  #wrap { position: relative; overflow: hidden; height: calc(100vh - 110px); cursor: crosshair; background: #000; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #img { display: block; user-select: none; -webkit-user-drag: none; }
  #marks { position: absolute; left: 0; top: 0; pointer-events: none; }
  footer { padding: 6px 14px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; }
  .k { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <label>Region image <input type="file" id="file" accept="image/png,image/jpeg"></label>
  <label>Predictions (optional) <input type="file" id="pred" accept="application/json"></label>
  <label>Annotator <input id="who" size="8" placeholder="initials"></label>
  <span>Class:</span>
  <button id="cw" class="on" data-cls="weed">weed (1)</button>
  <button id="cc" data-cls="crop">crop (2)</button>
  <button id="cu" data-cls="uncertain">uncertain (3)</button>
  <label><input type="checkbox" id="shadow"> in shadow</label>
  <label>diameter cm <input id="diam" size="4" placeholder="optional"></label>
  <label><input type="checkbox" id="showPred"> show predictions</label>
  <button id="undo">undo (z)</button>
  <button id="export">export JSON</button>
</header>
<div id="wrap">
  <div id="stage">
    <img id="img" alt="">
    <svg id="marks"></svg>
  </div>
</div>
<footer>
  <span><span class="k" style="border-color:#ef5350"></span>weed</span>
  <span><span class="k" style="border-color:#4CAF50"></span>crop</span>
  <span><span class="k" style="border-color:#9e9e9e"></span>uncertain</span>
  <span>Click a plant's centre to label it. Scroll to zoom, drag with the right button or Shift to pan. Labels are yours, never the software's: predictions are shown only when you ask, in faint colour, and are not pre-filled.</span>
  <span id="status"></span>
</footer>
<script>
// A region's labels, by a person: the image is one of the region PNGs that
// npm run eval:regions writes, with its <id>.predictions.json beside it for
// the photo, the box and the pixel size. Each click is one plant: its centre
// in the REGION's pixels, translated to the photo's native pixels on export.
// Nothing is pre-filled from the predictions; they can be shown faintly for
// context and that is all.
const COLOUR = { weed: "#ef5350", crop: "#4CAF50", uncertain: "#9e9e9e" };
const img = document.getElementById("img"), marks = document.getElementById("marks"), stage = document.getElementById("stage"), wrap = document.getElementById("wrap");
let labels = [], cls = "weed", meta = null, preds = [], view = { tx: 0, ty: 0, s: 1 }, drag = null, imageName = "";
const status = (t) => { document.getElementById("status").textContent = t; };
const apply = () => { stage.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.s})`; };
function draw() {
  marks.setAttribute("width", img.naturalWidth); marks.setAttribute("height", img.naturalHeight);
  marks.setAttribute("viewBox", `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
  const sw = 2 / view.s;
  let svg = "";
  if (document.getElementById("showPred").checked && meta) {
    for (const p of preds) {
      const r = Math.max(6, (p.equivDiameterM / (meta.gsdCmPx / 100)) / 2);
      svg += `<circle cx="${p.x - meta.region.x}" cy="${p.y - meta.region.y}" r="${r}" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="${sw}" stroke-dasharray="4 3"/>`;
    }
  }
  labels.forEach((l, i) => {
    const r = l.diameterCm && meta ? Math.max(6, (l.diameterCm / meta.gsdCmPx) / 2) : 10 / view.s;
    svg += `<circle cx="${l.rx}" cy="${l.ry}" r="${r}" fill="none" stroke="${COLOUR[l.cls]}" stroke-width="${sw}"/>`;
    svg += `<text x="${l.rx + r + 2}" y="${l.ry + 4 / view.s}" fill="${COLOUR[l.cls]}" font-size="${12 / view.s}" font-family="monospace">${i + 1}${l.shadow ? "s" : ""}</text>`;
  });
  marks.innerHTML = svg;
  status(`${labels.length} label(s): ${["weed", "crop", "uncertain"].map(k => `${labels.filter(l => l.cls === k).length} ${k}`).join(", ")}${meta ? ` · ${meta.photo} box ${meta.region.x},${meta.region.y} ${meta.region.width}x${meta.region.height} at ${meta.gsdCmPx.toFixed(2)} cm/px` : " · no predictions file: export carries region pixels only"}`);
}
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  imageName = f.name; labels = [];
  img.onload = () => { view = { tx: 0, ty: 0, s: Math.min(wrap.clientWidth / img.naturalWidth, wrap.clientHeight / img.naturalHeight) }; apply(); draw(); };
  img.src = URL.createObjectURL(f);
});
document.getElementById("pred").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  const j = JSON.parse(await f.text());
  meta = { region: j.region, photo: j.photo, gsdCmPx: j.gsdCmPx }; preds = j.predictions ?? []; draw();
});
for (const b of document.querySelectorAll("button[data-cls]")) b.addEventListener("click", () => { cls = b.dataset.cls; for (const o of document.querySelectorAll("button[data-cls]")) o.classList.toggle("on", o === b); });
document.getElementById("showPred").addEventListener("change", draw);
document.getElementById("undo").addEventListener("click", () => { labels.pop(); draw(); });
wrap.addEventListener("wheel", e => {
  e.preventDefault();
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const k = Math.pow(1.1, -e.deltaY / 100), s = Math.max(0.05, Math.min(16, view.s * k)), ratio = s / view.s;
  view = { s, tx: px - (px - view.tx) * ratio, ty: py - (py - view.ty) * ratio }; apply(); draw();
}, { passive: false });
wrap.addEventListener("pointerdown", e => {
  if (e.button === 2 || e.shiftKey) { drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty }; wrap.setPointerCapture(e.pointerId); return; }
  if (e.button !== 0 || !img.naturalWidth) return;
  const r = wrap.getBoundingClientRect();
  const rx = (e.clientX - r.left - view.tx) / view.s, ry = (e.clientY - r.top - view.ty) / view.s;
  if (rx < 0 || ry < 0 || rx > img.naturalWidth || ry > img.naturalHeight) return;
  const diam = parseFloat(document.getElementById("diam").value);
  labels.push({ rx: +rx.toFixed(1), ry: +ry.toFixed(1), cls, shadow: document.getElementById("shadow").checked, diameterCm: Number.isFinite(diam) && diam > 0 ? diam : null, at: new Date().toISOString() });
  draw();
});
wrap.addEventListener("pointermove", e => { if (!drag) return; view.tx = drag.tx + (e.clientX - drag.x); view.ty = drag.ty + (e.clientY - drag.y); apply(); });
wrap.addEventListener("pointerup", () => { drag = null; });
wrap.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "1") document.getElementById("cw").click();
  if (e.key === "2") document.getElementById("cc").click();
  if (e.key === "3") document.getElementById("cu").click();
  if (e.key === "z") document.getElementById("undo").click();
});
document.getElementById("export").addEventListener("click", () => {
  const who = document.getElementById("who").value.trim() || null;
  const out = {
    format: "swardus-region-labels-v1",
    image: imageName, photo: meta?.photo ?? null, region: meta?.region ?? null, gsdCmPx: meta?.gsdCmPx ?? null,
    annotator: who, exportedAt: new Date().toISOString(),
    labels: labels.map((l, i) => ({
      id: `${meta?.region?.id ?? imageName}:L${i + 1}`, cls: l.cls,
      // The photo's native pixel when the region is known, else the region's own pixel.
      x: meta ? +(meta.region.x + l.rx).toFixed(1) : l.rx, y: meta ? +(meta.region.y + l.ry).toFixed(1) : l.ry,
      regionX: l.rx, regionY: l.ry, diameterCm: l.diameterCm, shadow: l.shadow, labelledAt: l.at,
    })),
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = `${meta?.region?.id ?? imageName.replace(/\.[^.]+$/, "")}.labels.json`;
  a.click();
});
</script>
</body>
</html>
