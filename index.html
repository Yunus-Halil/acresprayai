<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- These are the tags link-preview crawlers see. LinkedIn, Slack, iMessage
         and the rest do not execute JavaScript, so whatever is here is what a
         shared link renders as - the per-route <Seo> component only reaches
         crawlers that render, which in practice means Googlebot. Keep this head
         describing the homepage. -->
    <title>SwathWise — Precision spray missions from drone imagery</title>
    <meta name="description" content="Upload drone images, get a stitched map of your farm, and let AI find the crops that need spraying — with flight plans ready for your drone." />
    <meta name="author" content="SwathWise" />
    <link rel="canonical" href="https://swathwise.com/" />

    <!-- Pointed at the source asset, not /favicon.png, so Vite emits it with a
         content hash. Browsers cache favicons far more aggressively than page
         assets - often past a hard refresh - so replacing the bytes behind a
         fixed URL leaves the old mark in everyone's tab indefinitely. A hashed
         URL changes whenever the image does, which is the same reason the NDVI
         tile URLs carry a band-mapping fingerprint.
         public/favicon.png is kept in step as a fallback for crawlers that
         fetch that path blindly rather than reading this tag. -->
    <link rel="icon" href="/src/assets/swathwise-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/src/assets/swathwise-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Absolute URLs throughout: a relative og:image is ignored or mis-resolved
         by most preview crawlers. share-card.png is a static file, generated by
         scripts/build-share-card.cjs, so nothing has to render for it to load. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SwathWise" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://swathwise.com/" />
    <meta property="og:title" content="SwathWise — Precision spray missions from drone imagery" />
    <meta property="og:description" content="Upload drone images, get a stitched map of your farm, and let AI find the crops that need spraying — with flight plans ready for your drone." />
    <meta property="og:image" content="https://swathwise.com/share-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The SwathWise mark: a single boustrophedon spray pass." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwathWise — Precision spray missions from drone imagery" />
    <meta name="twitter:description" content="Upload drone images, get a stitched map of your farm, and let AI find the crops that need spraying — with flight plans ready for your drone." />
    <meta name="twitter:image" content="https://swathwise.com/share-card.png" />
    <meta name="twitter:image:alt" content="The SwathWise mark: a single boustrophedon spray pass." />

    <!-- Only what we can stand behind: who we are, where we live, what the mark
         is. No aggregateRating, no fabricated sameAs profiles - schema that
         describes things which are not true is the kind that earns a manual
         action. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SwathWise",
        "url": "https://swathwise.com/",
        "logo": "https://swathwise.com/favicon.png",
        "description": "SwathWise turns drone imagery of a field into an orthomosaic, flags the crops that need spraying, and generates a spray mission that treats only those patches."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
